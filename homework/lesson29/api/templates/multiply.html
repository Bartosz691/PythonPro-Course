<!DOCTYPE html>

<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Mnożenie Celery</title>
</head>

<body>

    <h1>Mnożenie dwóch liczb</h1>

    <form method="post">
        {% csrf_token %}

        <label>Liczba A:</label>
        <input type="number" name="a" required>

        <br><br>

        <label>Liczba B:</label>
        <input type="number" name="b" required>

        <br><br>

        <button type="submit">Pomnóż</button>
    </form>

</body>

</html>
