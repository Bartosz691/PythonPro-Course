<!DOCTYPE html>

<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Upload obrazu</title>
</head>

<body>

<h1>Klasyfikacja obrazu</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="file" name="image" accept="image/*" required>

    <button type="submit">
        Wyślij
    </button>
</form>

</body>

</html>
