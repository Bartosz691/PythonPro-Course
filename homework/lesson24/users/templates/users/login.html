{% extends "users/base.html" %}

{% block content %}

<h1>Logowanie</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    {% if next %}
        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >
    {% endif %}

    <button type="submit">
        Zaloguj
    </button>
</form>

{% endblock %}
